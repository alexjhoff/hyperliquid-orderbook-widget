name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Warnings are errors, so a new Xcode is adopted on purpose rather than by a runner image update.
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtime = sorted(k for k in devices if "iOS-26" in k)[-1]
          print(next(d["udid"] for d in devices[runtime] if d["name"].startswith("iPhone")))
          ')
          xcrun simctl boot "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Package tests
        working-directory: OrderBookWidget
        run: xcodebuild test -quiet -scheme OrderBookWidget -destination "id=${{ steps.sim.outputs.udid }}"

      - name: Build the demo and widget extension for device
        run: |
          xcodebuild build -quiet -project OrderBookDemo.xcodeproj -scheme OrderBookDemo \
            -configuration Release -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO
