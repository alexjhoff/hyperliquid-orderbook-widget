name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.46.0
  # Warnings are errors, so a new Xcode is adopted on purpose rather than by a runner image update.
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: xcrun swift-format lint --strict --recursive OrderBookWidget/Package.swift OrderBookWidget/Sources OrderBookWidget/Tests Demo WidgetExtension

      - name: Verify the committed project matches project.yml
        run: |
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          rm xcodegen.zip
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
          git diff --exit-code -- OrderBookDemo.xcodeproj

      - name: Boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtime = sorted(k for k in devices if "iOS-26" in k)[-1]
          print(next(d["udid"] for d in devices[runtime] if d["name"].startswith("iPhone")))
          ')
          xcrun simctl boot "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Package tests
        working-directory: OrderBookWidget
        run: xcodebuild test -quiet -scheme OrderBookWidget -destination "id=${{ steps.sim.outputs.udid }}"

      - name: Build the demo and widget extension for device
        run: |
          xcodebuild build -quiet -project OrderBookDemo.xcodeproj -scheme OrderBookDemo \
            -configuration Release -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO
