name: OrderBookDemo
options:
  bundleIdPrefix: com.alexhoff
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  OrderBookWidget:
    path: OrderBookWidget
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  OrderBookDemo:
    type: application
    platform: iOS
    sources:
      - path: Demo
    dependencies:
      - package: OrderBookWidget
      - target: OrderBookWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexhoff.OrderBookWidgetDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Order Book
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  OrderBookWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
    dependencies:
      - package: OrderBookWidget
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Order Book
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexhoff.OrderBookWidgetDemo.widget
        SKIP_INSTALL: YES
schemes:
  OrderBookDemo:
    build:
      targets:
        OrderBookDemo: all
    run:
      config: Debug
    archive:
      config: Release
