name: OrderBookDemo
options:
  bundleIdPrefix: com.alexhoff
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  OrderBookWidget:
    path: OrderBookWidget
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  OrderBookDemo:
    type: application
    platform: iOS
    sources:
      - path: Demo
    dependencies:
      - package: OrderBookWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexhoff.OrderBookWidgetDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Order Book
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  OrderBookDemo:
    build:
      targets:
        OrderBookDemo: all
    run:
      config: Debug
    archive:
      config: Release
